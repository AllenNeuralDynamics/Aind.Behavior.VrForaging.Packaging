name: aind-behavior-vr-foraging-packaging test suite

on:
  pull_request:
  push:
    branches:
      - main
      - dev*
      - release*
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ╔──────────────────────────╗
  # │   _____         _        │
  # │  |_   _|__  ___| |_ ___  │
  # │    | |/ _ \/ __| __/ __| │
  # │    | |  __/\__ \ |_\__ \ │
  # │    |_|\___||___/\__|___/ │
  # │                          │
  # ╚──────────────────────────╝
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install python dependencies
        run: uv sync

      - name: Run ruff format
        run: uv run ruff format --check

      - name: Run ruff check
        run: uv run ruff check

      - name: Run codespell
        run: uv run codespell --check-filenames

      - name: Run ty
        run: uv run ty check

      - name: Run pytest
        run: uv run pytest

      - name: Build
        run: uv build

  # ╔─────────────────────────────────────────────────╗
  # │   ___                                            │
  # │  |_ _|_ __ ___   __ _  __ _  ___                 │
  # │   | || '_ ` _ \ / _` |/ _` |/ _ \                │
  # │   | || | | | | | (_| | (_| |  __/                │
  # │  |___|_| |_| |_|\__,_|\__, |\___|                │
  # │                       |___/                       │
  # ╚─────────────────────────────────────────────────╝
  # Processor/worker image for the session-processing pipeline (§12, docker/).
  # Built only on main / a published release / manual dispatch — not on every
  # PR — since it pushes to GHCR and needs `packages: write`.

  image:
    name: Build & push processor image
    needs: tests
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.action == 'published')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm needs full tag history — see docker/Dockerfile

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          echo "### Processor image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin \`processor.digest\` to this value in the worker config (§13) — never pin by tag." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke-test processor image
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Entrypoint runs at all
        run: docker run --rm "ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}" --help

      - name: Restore integration data cache
        uses: actions/cache@v6
        with:
          path: tests/integration/.cache
          key: integration-data-${{ hashFiles('tests/integration/datasets.yml') }}
          restore-keys: |
            integration-data-

      - name: Run against one cached session and validate the sidecar
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}"
          SESSION_DIR=$(find tests/integration/.cache -mindepth 2 -maxdepth 2 -type d | head -n 1)
          if [ -z "$SESSION_DIR" ]; then
            echo "No cached session available (cache miss on a fresh main branch) — skipping content assertions."
            exit 0
          fi
          SESSION_NAME=$(basename "$SESSION_DIR")
          OUT_DIR=$(mktemp -d)
          # Mounted at /in/$SESSION_NAME, not /in: the processor takes a session's
          # identity from its input directory's name, so a generic mount point
          # would stamp every table with session_id="in" and raise nothing. This
          # is the same invariant the worker upholds (Worker._resolve_mount).
          docker run --rm \
            -v "$(realpath "$SESSION_DIR")":"/in/$SESSION_NAME":ro \
            -v "$OUT_DIR":/out \
            -e "PROCESSOR_IMAGE_URI=$IMAGE" \
            "$IMAGE" \
            session --input-dir "/in/$SESSION_NAME" --output-dir /out --write-sidecar
          SIDECAR="$OUT_DIR/output.metadata.json"
          test -f "$SIDECAR"
          python3 - "$SIDECAR" "${{ needs.image.outputs.digest }}" "$SESSION_NAME" <<'PYEOF'
          import json, sys
          sidecar_path, expected_digest, session_name = sys.argv[1], sys.argv[2], sys.argv[3]
          data = json.load(open(sidecar_path))
          assert data["status"] == "ok", data
          assert data["session_name"] == session_name, (
              f"sidecar session_name {data['session_name']!r} != mounted {session_name!r}"
          )
          assert data["code"]["container"]["digest"] == expected_digest, (
              f"sidecar digest {data['code']['container']['digest']!r} != launched {expected_digest!r}"
          )
          assert data["code"]["provenance"] == "pinned-digest", data["code"]["provenance"]
          assert "dev" not in data["code"]["version"], f"non-release version string: {data['code']['version']!r}"
          print("Sidecar OK:", data["session_name"], data["code"]["version"], data["code"]["container"]["digest"])
          PYEOF

  # ╔─────────────────────────────────────────────────╗
  # │   ___       _                        _   _              │
  # │  |_ _|_ __ | |_ ___  __ _ _ __ __ _| |_(_) ___  _ __  │
  # │   | || '_ \| __/ _ \/ _` | '__/ _` | __| |/ _ \| '_ \ │
  # │   | || | | | ||  __/ (_| | | | (_| | |_| | (_) | | | |│
  # │  |___|_| |_|\__\___|\__, |_|  \__,_|\__|_|\___/|_| |_| │
  # │                     |___/                               │
  # ╚─────────────────────────────────────────────────────────╝

  integration-tests:
    name: Integration tests (S3 datasets)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-integration')) ||
      (github.event_name == 'release' && github.event.action == 'published')

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install python dependencies
        run: uv sync

      - name: Restore integration data cache
        uses: actions/cache@v6
        with:
          path: tests/integration/.cache
          key: integration-data-${{ hashFiles('tests/integration/datasets.yml') }}
          restore-keys: |
            integration-data-

      - name: Run integration tests
        run: uv run pytest -m integration --tb=short

  # ╔─────────────────────────────────────────────────────────────────╗
  # │   ____        _     _ _        ____      _                      │
  # │  |  _ \ _   _| |__ | (_) ___  |  _ \ ___| | ___  __ _ ___  ___  │
  # │  | |_) | | | | '_ \| | |/ __| | |_) / _ \ |/ _ \/ _` / __|/ _ \ │
  # │  |  __/| |_| | |_) | | | (__  |  _ <  __/ |  __/ (_| \__ \  __/ │
  # │  |_|    \__,_|_.__/|_|_|\___| |_| \_\___|_|\___|\__,_|___/\___| │
  # │                                                                 │
  # ╚─────────────────────────────────────────────────────────────────╝

  prepare-release:
    runs-on: ubuntu-latest
    name: Build release
    needs: [tests, integration-tests]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required so setuptools-scm can read the full tag history
          ref: ${{ github.event.release.tag_name }}

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ╔───────────────────────────────────────╗
  # │   ____        ____ ___                │
  # │  |  _ \ _   _|  _ \_ _|               │
  # │  | |_) | | | | |_) | |                │
  # │  |  __/| |_| |  __/| |                │
  # │  |_|    \__, |_|  |___|               │
  # │         |___/                         │
  # ╚───────────────────────────────────────╝
  publish-to-pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs: prepare-release
    steps:
      - name: Download wheels artifact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.AIND_PYPI_TOKEN }}

      - name: Upload wheels to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  # ╔─────────────────────────────────────────────────╗
  # │   ____                                          │
  # │  |  _ \  ___   ___  ___                         │
  # │  | | | |/ _ \ / __|/ __|                        │
  # │  | |_| | (_) | (__\__ \                         │
  # │  |____/ \___/ \___|___/                         │
  # │                                                 │
  # ╚─────────────────────────────────────────────────╝

  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build site
        run: uv run zensical build --clean

      - name: Upload pages artifact
        if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-docs:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
