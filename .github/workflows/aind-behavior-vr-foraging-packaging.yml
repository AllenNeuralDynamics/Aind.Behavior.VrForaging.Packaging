name: aind-behavior-vr-foraging-packaging test suite

on:
  pull_request:
  push:
    branches:
      - main
      - dev*
      - release*
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ╔──────────────────────────╗
  # │   _____         _        │
  # │  |_   _|__  ___| |_ ___  │
  # │    | |/ _ \/ __| __/ __| │
  # │    | |  __/\__ \ |_\__ \ │
  # │    |_|\___||___/\__|___/ │
  # │                          │
  # ╚──────────────────────────╝
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install python dependencies
        run: uv sync

      - name: Run ruff format
        run: uv run ruff format --check

      - name: Run ruff check
        run: uv run ruff check

      - name: Run codespell
        run: uv run codespell --check-filenames

      - name: Run ty
        run: uv run ty check

      - name: Run pytest
        run: uv run pytest

      - name: Build
        run: uv build

  # ╔─────────────────────────────────────────────────╗
  # │   ___       _                        _   _              │
  # │  |_ _|_ __ | |_ ___  __ _ _ __ __ _| |_(_) ___  _ __  │
  # │   | || '_ \| __/ _ \/ _` | '__/ _` | __| |/ _ \| '_ \ │
  # │   | || | | | ||  __/ (_| | | | (_| | |_| | (_) | | | |│
  # │  |___|_| |_|\__\___|\__, |_|  \__,_|\__|_|\___/|_| |_| │
  # │                     |___/                               │
  # ╚─────────────────────────────────────────────────────────╝

  integration-tests:
    name: Integration tests (S3 datasets)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-integration')) ||
      (github.event_name == 'release' && github.event.action == 'published')

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install python dependencies
        run: uv sync

      - name: Restore integration data cache
        uses: actions/cache@v6
        with:
          path: tests/integration/.cache
          key: integration-data-${{ hashFiles('tests/integration/datasets.yml') }}
          restore-keys: |
            integration-data-

      - name: Run integration tests
        run: uv run pytest -m integration --tb=short

  # ╔─────────────────────────────────────────────────────────────────╗
  # │   ____        _     _ _        ____      _                      │
  # │  |  _ \ _   _| |__ | (_) ___  |  _ \ ___| | ___  __ _ ___  ___  │
  # │  | |_) | | | | '_ \| | |/ __| | |_) / _ \ |/ _ \/ _` / __|/ _ \ │
  # │  |  __/| |_| | |_) | | | (__  |  _ <  __/ |  __/ (_| \__ \  __/ │
  # │  |_|    \__,_|_.__/|_|_|\___| |_| \_\___|_|\___|\__,_|___/\___| │
  # │                                                                 │
  # ╚─────────────────────────────────────────────────────────────────╝

  prepare-release:
    runs-on: ubuntu-latest
    name: Build release
    needs: [tests, integration-tests]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required so setuptools-scm can read the full tag history
          ref: ${{ github.event.release.tag_name }}

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ╔───────────────────────────────────────╗
  # │   ____        ____ ___                │
  # │  |  _ \ _   _|  _ \_ _|               │
  # │  | |_) | | | | |_) | |                │
  # │  |  __/| |_| |  __/| |                │
  # │  |_|    \__, |_|  |___|               │
  # │         |___/                         │
  # ╚───────────────────────────────────────╝
  publish-to-pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs: prepare-release
    steps:
      - name: Download wheels artifact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.AIND_PYPI_TOKEN }}

      - name: Upload wheels to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  # ╔─────────────────────────────────────────────────╗
  # │   ____                                          │
  # │  |  _ \  ___   ___  ___                         │
  # │  | | | |/ _ \ / __|/ __|                        │
  # │  | |_| | (_) | (__\__ \                         │
  # │  |____/ \___/ \___|___/                         │
  # │                                                 │
  # ╚─────────────────────────────────────────────────╝

  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build site
        run: uv run zensical build --clean

      - name: Upload pages artifact
        if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-docs:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
