# Workspace root. Deliberately has no [project]: it builds nothing and is never
# published, so neither distribution's metadata can pick up the other's dependencies
# or the shared dev tooling.
#
#   packaging/  aind-behavior-vr-foraging-packaging  → PyPI
#   server/     processing-server                    → never published
#
# The dependency runs one way, server → packaging, enforced by
# tests/test_package_boundary.py.

[tool.uv.workspace]
members = ["packaging", "server"]

[dependency-groups]

docs = [
    "zensical>=0.0.43",
    "mkdocstrings[python]>=0.27",
]

dev = [
    'ruff',
    'pytest',
    'pytest-cov',
    'codespell',
    'ty',
    # Here rather than in packaging's dev group: this root publishes nothing, so the
    # server cannot reach the wheel's metadata from here. A bare `uv sync` then gives
    # both members and one `pytest` run covers both suites.
    'processing-server',
]

[tool.uv]
default-groups = ['dev']

[tool.uv.sources]
processing-server = { workspace = true }

# One config for both members, so a lint rule or a marker cannot drift between them.

[tool.ty.src]
exclude = ["examples/**", "scripts/**", "docs/**", "scratch/**"]

[tool.ruff]
line-length = 120
target-version = 'py311'
# Both members' source roots, so isort knows what is first-party. Without this, ruff
# only auto-detects a top-level `src/` and sorts both packages as third-party.
src = ["packaging/src", "server/src"]

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = ["BLE001"]
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,uv.lock,site'
ignore-words-list = 'nd,setuptools'

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short --cov=packaging/src --cov=server/src --cov-report=term-missing --cov-fail-under=0 -m 'not integration'"
markers = [
  "integration: integration tests that download data from S3 (run with `-m integration`)",
]
# Both members, plus the root suite for workspace-level invariants.
testpaths = ["tests", "packaging/tests", "server/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
