# Integration test datasets. See docs/plans/2026-05-09-integration-tests-design.md.
#
# Default exclusions (always applied, in addition to per-entry `exclude`):
#   **/*.mp4, **/*.avi, **/*.mkv
# See DEFAULT_EXCLUDES in tests/integration/conftest.py.
#
# Schema (every field):
# datasets:
#   - id: <stable-handle>            # unique kebab-case identifier
#     uri: s3://bucket/prefix/       # must end with '/'
#     rationale: |                   # required; explains why this dataset is here
#       Multi-line description of why this dataset is in the suite.
#     exclude:                       # optional; pathlib glob, case-insensitive
#       - "videos/**"
#       - "**/*.avi"
#     expected:                      # optional; assertion invariants
#       n_sites: 412
#       n_choices: 180
#       n_rewards: 92
#       average_p_reward_per_site: 0.42
#       n_blocks: 4
#       n_patches: 16
#       nwb_validates: true
#     xfail: false                   # optional; default false
#     xfail_reason: ""               # optional; only when xfail: true
#
# Optional schema-migration corpora:
# schema_corpora:
#   - id: historical-schema-corpus
#     uri: s3://public-bucket/path/session.parquet
#     rationale: |
#       Full historical session/rig/task-logic regression corpus.
schema_corpora:
  - id: vr-foraging-historical-schemas
    uri: s3://aind-scratch-data/vr-foraging/vr-foraging-dataset/session.parquet
    rationale: |
      Full historical session, rig, and task-logic corpus produced by the
      VR Foraging primary-data aggregator.

